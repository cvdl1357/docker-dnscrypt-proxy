name: Build and Publish dnscrypt-proxy

on:
  # Triggers the workflow on push events for main/master branches
  push:
    branches: [ "main", "master" ]
    # Only run if source files or this workflow change
    paths:
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'dnscrypt-proxy.toml.template'
      - 'docker-compose.yaml'
      - 'README.md'
      - '.github/workflows/docker-publish.yml'

  # Weekly scheduled build (Runs every Sunday at 02:00 UTC)
  schedule:
    - cron: '0 2 * * 0'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # github.repository is the "username/repo" formatted name
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # Sets permissions granted to the GITHUB_TOKEN
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU for multi-architecture builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          # Generates tags for both GHCR and Docker Hub simultaneously
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ secrets.DOCKERHUB_USERNAME }}/dnscrypt-proxy
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          # Compiles for Synology (amd64) and Raspberry Pi (arm64, arm/v7)
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          # Forces checking/pulling the latest base layer on scheduled runs
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Utilizes GitHub Actions cache to dramatically speed up future builds
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub Description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/dnscrypt-proxy
          short-description: "Flexible, lightweight multi-arch dnscrypt-proxy container based on Alpine Linux."
          readme-filepath: ./README.md
          enable-url-completion: true
